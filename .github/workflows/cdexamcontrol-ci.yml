name: CD Exam Control candidate checks

on:
  push:
    branches: ['development/cdexamcontrol-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/js/run.cjs
      - run: python3 tools/validate_release.py

  moodle:
    name: Moodle 4.5 / PHP ${{ matrix.php }} / ${{ matrix.database }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        database: [pgsql, mariadb]
    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s --health-timeout 5s --health-retries 3
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, soap, intl
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none
      - name: Set up Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install Moodle test environment
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: MOODLE_405_STABLE
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
      - name: PHP lint
        run: moodle-plugin-ci phplint
      - name: Moodle coding standards
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0
      - name: Moodle PHPDoc
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - name: Metadata and savepoints
        if: ${{ !cancelled() }}
        run: |
          moodle-plugin-ci validate
          moodle-plugin-ci savepoints
      - name: JavaScript and CSS standards
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0
      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
      - name: Compile canonical AMD
        if: ${{ success() && matrix.php == '8.1' && matrix.database == 'pgsql' }}
        working-directory: moodle
        run: npx grunt amd --root=mod/quiz/accessrule/cdexamcontrol
      - name: Preserve compiled AMD
        if: ${{ success() && matrix.php == '8.1' && matrix.database == 'pgsql' }}
        uses: actions/upload-artifact@v4
        with:
          name: cdexamcontrol-amd
          path: moodle/mod/quiz/accessrule/cdexamcontrol/amd/build/
          if-no-files-found: error

  package:
    needs: [monitor, moodle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cdexamcontrol-amd
          path: amd/build/
      - run: python3 tools/validate_release.py
      - run: python3 tools/build_release.py --output ./CD-Exam-Control-0.2.0.zip
      - name: Prepare directly installable artifact
        run: python3 -c "import zipfile; zipfile.ZipFile('CD-Exam-Control-0.2.0.zip').extractall('release')"
      - uses: actions/upload-artifact@v4
        with:
          name: CD-Exam-Control-0.2.0
          path: release/
          if-no-files-found: error
