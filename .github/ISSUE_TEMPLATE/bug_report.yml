name: Bug report
description: Report a reproducible CDexamSave problem without personal or assessment data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve CDexamSave. Do not include student names, quiz content, session identifiers, credentials, database exports or unredacted logs. Report suspected vulnerabilities privately as described in SECURITY.md.
  - type: input
    id: moodle
    attributes:
      label: Moodle version
      placeholder: "4.5.x (Build: YYYYMMDD)"
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: CDexamSave version
      placeholder: "1.0.1-rc1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: PHP, database, browser and operating-system versions.
    validations:
      required: true
  - type: dropdown
    id: attempt
    attributes:
      label: Attempt type
      options:
        - Real student attempt
        - Teacher preview
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a demonstration course and fictional users.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed personal data, assessment content, secrets and session identifiers.
          required: true
